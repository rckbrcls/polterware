name: Polterware Vitals release

on:
  push:
    tags:
      - vitals-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vitals-v<version> tag to build as a draft
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vitals-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/desktop-release.yml
    with:
      app: vitals
      tag: ${{ inputs.tag || github.ref_name }}
