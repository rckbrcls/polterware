name: Polterware Notes release

on:
  push:
    tags:
      - notes-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing notes-v<version> tag to build as a draft
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: notes-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/desktop-release.yml
    secrets:
      POLTERWARE_SPARKLE_PRIVATE_KEY: ${{ secrets.POLTERWARE_SPARKLE_PRIVATE_KEY }}
    with:
      app: notes
      tag: ${{ inputs.tag || github.ref_name }}
