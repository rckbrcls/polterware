name: Publish desktop update feed

# Drafts are never advertised. Publishing an alpha also triggers this event.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-update-feeds
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rckbrcls/polterware' && (startsWith(github.event.release.tag_name, 'polterware-v') || startsWith(github.event.release.tag_name, 'notes-v') || startsWith(github.event.release.tag_name, 'vitals-v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and advance only the published app feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(polterware|notes|vitals)-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          APP="${BASH_REMATCH[1]}"
          gh release download "$RELEASE_TAG" --pattern appcast.xml --dir "$RUNNER_TEMP/update-feed"
          python3 tooling/updater/refresh-feed.py "$APP" "$RELEASE_TAG" "$RUNNER_TEMP/update-feed/appcast.xml" "updates/$APP.xml"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "updates/$APP.xml"
          if ! git diff --cached --quiet; then
            git commit -m "chore(updates): publish $RELEASE_TAG feed"
            git push origin HEAD:main
          fi
