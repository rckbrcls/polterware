version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    # Doc 02 uses the same short RPC names (List, Get, Create) on several
    # services. Request and response messages are prefixed instead
    # (ListSpacesRequest) so RPC_REQUEST_RESPONSE_UNIQUE still holds.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
