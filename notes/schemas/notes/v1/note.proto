syntax = "proto3";

package notes.v1;

option go_package = "github.com/polterware/polterware/notes/backend/platform/gen/notes/v1;notesv1";

import "google/protobuf/timestamp.proto";
import "notes/v1/attachment.proto";
import "notes/v1/place.proto";
import "notes/v1/schedule.proto";
import "notes/v1/tag.proto";

// Note is the full row plus the relations selected by NoteInclude.
message Note {
  string id = 1;
  string space_id = 2;
  string title = 3;
  string content = 4;
  string status = 5;
  bool pinned = 6;
  optional int32 priority = 7;
  google.protobuf.Timestamp due_at = 8;
  bool due_all_day = 9;
  int32 sort_order = 10;
  bool auto_complete_on_checklist = 11;
  google.protobuf.Timestamp completed_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  int64 rev = 15;
  repeated CheckItem checklist = 16;
  repeated Tag tags = 17;
  Schedule schedule = 18;
  Place place = 19;
  repeated Attachment attachments = 20;
  repeated OccurrenceCompletion completions = 21;
}

message CheckItem {
  string id = 1;
  string note_id = 2;
  string title = 3;
  string detail = 4;
  bool done = 5;
  int32 sort_order = 6;
  google.protobuf.Timestamp completed_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CheckItemInput {
  string id = 1;
  string title = 2;
  string detail = 3;
  bool done = 4;
  int32 sort_order = 5;
}

// NoteSummary is the list shape. snippet is at most 120 characters.
message NoteSummary {
  string id = 1;
  string title = 2;
  string status = 3;
  string space_id = 4;
  google.protobuf.Timestamp due_at = 5;
  bool due_all_day = 6;
  bool pinned = 7;
  optional int32 priority = 8;
  repeated string tag_ids = 9;
  string schedule_label = 10;
  string snippet = 11;
  int64 rev = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp created_at = 14;
  int32 sort_order = 15;
}

// NoteInclude selects relations for Get. Unset flags omit those relations.
// content false leaves Note.content empty.
message NoteInclude {
  bool content = 1;
  bool checklist = 2;
  bool schedule = 3;
  bool place = 4;
  bool attachments = 5;
  bool completions = 6;
  bool tags = 7;
}

message ListNotesRequest {
  string space_id = 1;
  bool include_descendants = 2;
  bool inbox_only = 3;
  string status = 4;
  optional bool pinned = 5;
  repeated string tag_ids = 6;
  google.protobuf.Timestamp due_from = 7;
  google.protobuf.Timestamp due_to = 8;
  google.protobuf.Timestamp updated_from = 9;
  google.protobuf.Timestamp updated_to = 10;
  optional bool has_schedule = 11;
  optional bool has_place = 12;
  string query = 13;
  string order = 14;
  int32 limit = 15;
  string cursor = 16;
}

message ListNotesResponse {
  repeated NoteSummary notes = 1;
  string next_cursor = 2;
  int32 total = 3;
}

message GetNoteRequest {
  string id = 1;
  NoteInclude include = 2;
}

message GetNoteResponse {
  Note note = 1;
}

message CreateNoteRequest {
  string space_id = 1;
  string title = 2;
  string content = 3;
  bool pinned = 4;
  optional int32 priority = 5;
  google.protobuf.Timestamp due_at = 6;
  bool due_all_day = 7;
  int32 sort_order = 8;
  bool auto_complete_on_checklist = 9;
  repeated string tag_ids = 10;
  repeated CheckItemInput checklist = 11;
}

message CreateNoteResponse {
  Note note = 1;
}

message UpdateNoteRequest {
  string id = 1;
  optional int64 expected_rev = 2;
  optional string title = 3;
  optional string content = 4;
  optional string space_id = 5;
  bool clear_space_id = 6;
  optional int32 priority = 7;
  bool clear_priority = 8;
  optional google.protobuf.Timestamp due_at = 9;
  bool clear_due_at = 10;
  optional bool due_all_day = 11;
  optional int32 sort_order = 12;
  optional bool pinned = 13;
  optional bool auto_complete_on_checklist = 14;
}

message UpdateNoteResponse {
  Note note = 1;
}

message DeleteNoteRequest {
  string id = 1;
  optional int64 expected_rev = 2;
}

message DeleteNoteResponse {}

message SetNoteStatusRequest {
  string id = 1;
  string status = 2;
  optional int64 expected_rev = 3;
  google.protobuf.Timestamp occurrence_at = 4;
}

message SetNoteStatusResponse {
  Note note = 1;
}

message SetNotePinnedRequest {
  string id = 1;
  bool pinned = 2;
  optional int64 expected_rev = 3;
}

message SetNotePinnedResponse {
  Note note = 1;
}

message ReorderNotesRequest {
  string space_id = 1;
  repeated string ordered_ids = 2;
}

message ReorderNotesResponse {}

message ToggleCheckItemRequest {
  string note_id = 1;
  string item_id = 2;
  optional bool done = 3;
  optional int64 expected_rev = 4;
}

message ToggleCheckItemResponse {
  CheckItem item = 1;
  Note note = 2;
}

message ReplaceChecklistRequest {
  string note_id = 1;
  optional int64 expected_rev = 2;
  repeated CheckItemInput items = 3;
}

message ReplaceChecklistResponse {
  repeated CheckItem items = 1;
  Note note = 2;
}

message SetNoteTagsRequest {
  string note_id = 1;
  repeated string tag_ids = 2;
  optional int64 expected_rev = 3;
}

message SetNoteTagsResponse {
  repeated Tag tags = 1;
  Note note = 2;
}

message BulkNoteActionRequest {
  repeated string ids = 1;
  string action = 2;
  string space_id = 3;
  repeated string tag_ids = 4;
}

message BulkNoteItemResult {
  string id = 1;
  bool ok = 2;
  string error = 3;
}

message BulkNoteActionResponse {
  repeated BulkNoteItemResult results = 1;
}

service NoteService {
  rpc List(ListNotesRequest) returns (ListNotesResponse);
  rpc Get(GetNoteRequest) returns (GetNoteResponse);
  rpc Create(CreateNoteRequest) returns (CreateNoteResponse);
  rpc Update(UpdateNoteRequest) returns (UpdateNoteResponse);
  rpc Delete(DeleteNoteRequest) returns (DeleteNoteResponse);
  rpc SetStatus(SetNoteStatusRequest) returns (SetNoteStatusResponse);
  rpc SetPinned(SetNotePinnedRequest) returns (SetNotePinnedResponse);
  rpc Reorder(ReorderNotesRequest) returns (ReorderNotesResponse);
  rpc ToggleCheckItem(ToggleCheckItemRequest) returns (ToggleCheckItemResponse);
  rpc ReplaceChecklist(ReplaceChecklistRequest) returns (ReplaceChecklistResponse);
  rpc SetTags(SetNoteTagsRequest) returns (SetNoteTagsResponse);
  rpc BulkAction(BulkNoteActionRequest) returns (BulkNoteActionResponse);
}
