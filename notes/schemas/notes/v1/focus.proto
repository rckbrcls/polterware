syntax = "proto3";

package notes.v1;

option go_package = "github.com/polterware/polterware/notes/backend/platform/gen/notes/v1;notesv1";

import "google/protobuf/timestamp.proto";

message FocusDefaults {
  int32 work_min = 1;
  int32 short_break_min = 2;
  int32 long_break_min = 3;
  int32 cycles = 4;
  bool auto_continue = 5;
  bool sounds = 6;
  bool notifications = 7;
}

message FocusSession {
  string id = 1;
  string note_id = 2;
  string phase = 3;
  int32 planned_s = 4;
  int32 elapsed_s = 5;
  string state = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp ended_at = 8;
}

message GetFocusDefaultsRequest {}

message GetFocusDefaultsResponse {
  FocusDefaults defaults = 1;
}

message SetFocusDefaultsRequest {
  FocusDefaults defaults = 1;
}

message SetFocusDefaultsResponse {
  FocusDefaults defaults = 1;
}

message RecordFocusSessionRequest {
  string note_id = 1;
  string phase = 2;
  int32 planned_s = 3;
  int32 elapsed_s = 4;
  string state = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
}

message RecordFocusSessionResponse {
  FocusSession session = 1;
}

message ListFocusSessionsRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message ListFocusSessionsResponse {
  repeated FocusSession sessions = 1;
}

service FocusService {
  rpc GetDefaults(GetFocusDefaultsRequest) returns (GetFocusDefaultsResponse);
  rpc SetDefaults(SetFocusDefaultsRequest) returns (SetFocusDefaultsResponse);
  rpc RecordSession(RecordFocusSessionRequest) returns (RecordFocusSessionResponse);
  rpc ListSessions(ListFocusSessionsRequest) returns (ListFocusSessionsResponse);
}
