syntax = "proto3";

package notes.v1;

option go_package = "github.com/polterware/polterware/notes/backend/platform/gen/notes/v1;notesv1";

import "google/protobuf/timestamp.proto";

message CheckRequest {}

message McpHealth {
  int32 port = 1;
  bool enabled = 2;
}

message NotifierHealth {
  google.protobuf.Timestamp last_seen_at = 1;
}

message CheckResponse {
  string build = 1;
  string version = 2;
  google.protobuf.Timestamp started_at = 3;
  string db_path = 4;
  McpHealth mcp = 5;
  NotifierHealth notifier = 6;
}

service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse);
}
