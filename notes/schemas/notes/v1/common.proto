syntax = "proto3";

package notes.v1;

option go_package = "github.com/polterware/polterware/notes/backend/platform/gen/notes/v1;notesv1";

// FieldViolation is one INVALID_ARGUMENT detail.
message FieldViolation {
  string field = 1;
  string reason = 2;
}

// BadRequest is the error detail for INVALID_ARGUMENT.
message BadRequest {
  repeated FieldViolation violations = 1;
}

// PreconditionDetail is the error detail for FAILED_PRECONDITION.
// reason is rev_conflict, space_cycle, or schedule_in_the_past.
// On rev_conflict, current_json is the current entity and current_rev is its rev.
message PreconditionDetail {
  string reason = 1;
  string entity = 2;
  string entity_id = 3;
  int64 current_rev = 4;
  string current_json = 5;
}
