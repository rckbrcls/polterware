syntax = "proto3";

package notes.v1;

option go_package = "github.com/polterware/polterware/notes/backend/platform/gen/notes/v1;notesv1";

message Change {
  string entity = 1;
  string id = 2;
  string op = 3;
}

message WatchChangesRequest {
  int64 since_seq = 1;
}

// WatchChangesResponse streams committed changes.
// The first message has snapshot true, the current seq, and no changes.
message WatchChangesResponse {
  int64 seq = 1;
  repeated Change changes = 2;
  bool snapshot = 3;
}

service ChangeService {
  rpc Watch(WatchChangesRequest) returns (stream WatchChangesResponse);
}
