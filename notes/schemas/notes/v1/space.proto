syntax = "proto3";

package notes.v1;

option go_package = "github.com/polterware/polterware/notes/backend/platform/gen/notes/v1;notesv1";

import "google/protobuf/timestamp.proto";

// Space is one node in the space tree. Empty parent_id is a root.
message Space {
  string id = 1;
  string parent_id = 2;
  string name = 3;
  string color = 4;
  string icon = 5;
  int32 sort_order = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  int64 rev = 9;
}

message ListSpacesRequest {}

message ListSpacesResponse {
  repeated Space spaces = 1;
}

message GetSpaceRequest {
  string id = 1;
}

message GetSpaceResponse {
  Space space = 1;
}

message CreateSpaceRequest {
  string parent_id = 1;
  string name = 2;
  string color = 3;
  string icon = 4;
  int32 sort_order = 5;
}

message CreateSpaceResponse {
  Space space = 1;
}

// UpdateSpaceRequest applies patch fields that are set.
// clear_parent, clear_color, and clear_icon write NULL when true.
message UpdateSpaceRequest {
  string id = 1;
  optional int64 expected_rev = 2;
  optional string name = 3;
  optional string parent_id = 4;
  bool clear_parent = 5;
  optional string color = 6;
  bool clear_color = 7;
  optional string icon = 8;
  bool clear_icon = 9;
  optional int32 sort_order = 10;
}

message UpdateSpaceResponse {
  Space space = 1;
}

message DeleteSpaceRequest {
  string id = 1;
  optional int64 expected_rev = 2;
}

message DeleteSpaceResponse {
  repeated string deleted_space_ids = 1;
  int32 moved_note_count = 2;
}

message ReorderSpacesRequest {
  string parent_id = 1;
  repeated string ordered_ids = 2;
}

message ReorderSpacesResponse {
  repeated Space spaces = 1;
}

service SpaceService {
  rpc List(ListSpacesRequest) returns (ListSpacesResponse);
  rpc Get(GetSpaceRequest) returns (GetSpaceResponse);
  rpc Create(CreateSpaceRequest) returns (CreateSpaceResponse);
  rpc Update(UpdateSpaceRequest) returns (UpdateSpaceResponse);
  rpc Delete(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  rpc Reorder(ReorderSpacesRequest) returns (ReorderSpacesResponse);
}
