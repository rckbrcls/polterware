syntax = "proto3";

package notes.v1;

option go_package = "github.com/polterware/polterware/notes/backend/platform/gen/notes/v1;notesv1";

import "google/protobuf/timestamp.proto";

message Tag {
  string id = 1;
  string name = 2;
  string color = 3;
  int32 usage_count = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  int64 rev = 7;
}

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message CreateTagRequest {
  string name = 1;
  string color = 2;
}

message CreateTagResponse {
  Tag tag = 1;
}

message UpdateTagRequest {
  string id = 1;
  optional int64 expected_rev = 2;
  optional string name = 3;
  optional string color = 4;
  bool clear_color = 5;
}

message UpdateTagResponse {
  Tag tag = 1;
}

message DeleteTagRequest {
  string id = 1;
}

message DeleteTagResponse {}

// MergeTagsRequest moves every note from source_id onto target_id, then deletes source_id.
message MergeTagsRequest {
  string source_id = 1;
  string target_id = 2;
}

message MergeTagsResponse {
  Tag target = 1;
  int32 moved_note_count = 2;
}

service TagService {
  rpc List(ListTagsRequest) returns (ListTagsResponse);
  rpc Create(CreateTagRequest) returns (CreateTagResponse);
  rpc Update(UpdateTagRequest) returns (UpdateTagResponse);
  rpc Delete(DeleteTagRequest) returns (DeleteTagResponse);
  rpc Merge(MergeTagsRequest) returns (MergeTagsResponse);
}
