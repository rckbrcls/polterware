version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/polterware/polterware/backend/platform/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../backend/platform/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: ../backend/platform/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.16.0
    out: ../packages/contracts/src/gen
    opt:
      - target=ts
