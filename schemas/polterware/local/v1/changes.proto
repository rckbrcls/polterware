syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

// ChangeService streams what changed in the local store (Decision 0007). Events are
// derived from committed SQLite transactions, coalesced, and numbered.
message WatchChangesRequest {
  // after_seq resumes after the last event a client saw; 0 starts fresh.
  int64 after_seq = 1;
}

message WatchChangesResponse {
  int64 seq = 1;
  // project_ids lists the projects touched; empty means not project-scoped
  // or unknown, so clients refresh the current project.
  repeated string project_ids = 2;
  // kinds: projects, environments, work, knowledge, canon, agent_runs,
  // architecture, integrations, settings.
  repeated string kinds = 3;
  // resync asks the client to reload everything (missed events).
  bool resync = 4;
  string at = 5;
  // origins names the clients whose calls committed these writes (desktop,
  // cli, mcp, tui); "core" when no client call was in flight (background
  // work). A client may skip events that only it caused.
  repeated string origins = 6;
}

service ChangeService {
  // The first event carries the current seq and no kinds.
  rpc WatchChanges(WatchChangesRequest) returns (stream WatchChangesResponse);
}
