syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

message Project {
  string id = 1;
  string name = 2;
  string root_path = 3;
  string created_at = 4;
  string updated_at = 5;
  string status = 6; // active | archived
  string archived_at = 7;
}

message Environment {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string kind = 4;
  string protection = 5;
  bool is_default = 6;
  string description = 7;
}

message ProjectSettings {
  string project_id = 1;
  string description = 2;
  string default_environment_id = 3;
  string repository = 4;
  // agents_sync is read-only here: SaveProjectSettings ignores it and
  // WorkService.SetAgentsSync changes it.
  bool agents_sync = 5;
}

message ListProjectsRequest {
  bool include_archived = 1;
}
message ListProjectsResponse { repeated Project projects = 1; }
message SaveProjectRequest { Project project = 1; }
message SaveProjectResponse { Project project = 1; }
message ArchiveProjectRequest { string id = 1; }
message ArchiveProjectResponse { Project project = 1; }
message ListEnvironmentsRequest { string project_id = 1; }
message ListEnvironmentsResponse { repeated Environment environments = 1; }
message SaveEnvironmentRequest { Environment environment = 1; }
message SaveEnvironmentResponse { Environment environment = 1; }
message DeleteEnvironmentRequest {
  string id = 1;
  string project_id = 2;
}
message DeleteEnvironmentResponse {}
message GetProjectSettingsRequest { string project_id = 1; }
message GetProjectSettingsResponse { ProjectSettings settings = 1; }
message SaveProjectSettingsRequest { ProjectSettings settings = 1; }
message SaveProjectSettingsResponse { ProjectSettings settings = 1; }

// ResolveProject returns the project with id, or, when id is empty, the
// registered project whose root contains dir (deepest root wins).
message ResolveProjectRequest {
  string id = 1;
  string dir = 2;
}
message ResolveProjectResponse { Project project = 1; }

// InitProject registers a project with an empty layout and a "local" environment.
message InitProjectRequest {
  string id = 1;
  string name = 2;
  string root_path = 3;
}
message InitProjectResponse { Project project = 1; }

// ProjectRepo is an extra local Git checkout. The project root_path is not a row.
message ProjectRepo {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string path = 4;
}

message ListProjectReposRequest { string project_id = 1; }
message ListProjectReposResponse { repeated ProjectRepo repos = 1; }
message AddProjectRepoRequest {
  string project_id = 1;
  string name = 2;
  string path = 3;
}
message AddProjectRepoResponse { ProjectRepo repo = 1; }
message RemoveProjectRepoRequest {
  string project_id = 1;
  string name = 2;
}
message RemoveProjectRepoResponse {}

service ProjectService {
  rpc ResolveProject(ResolveProjectRequest) returns (ResolveProjectResponse);
  rpc InitProject(InitProjectRequest) returns (InitProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc SaveProject(SaveProjectRequest) returns (SaveProjectResponse);
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc SaveEnvironment(SaveEnvironmentRequest) returns (SaveEnvironmentResponse);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse);
  rpc GetProjectSettings(GetProjectSettingsRequest) returns (GetProjectSettingsResponse);
  rpc SaveProjectSettings(SaveProjectSettingsRequest) returns (SaveProjectSettingsResponse);
  rpc ListProjectRepos(ListProjectReposRequest) returns (ListProjectReposResponse);
  rpc AddProjectRepo(AddProjectRepoRequest) returns (AddProjectRepoResponse);
  rpc RemoveProjectRepo(RemoveProjectRepoRequest) returns (RemoveProjectRepoResponse);
}
