syntax = "proto3";
package polterware.local.v1;
option go_package = "github.com/polterware/polterware/backend/platform/gen/polterware/local/v1;localv1";

import "polterware/local/v1/agentrun.proto";

message KnowledgeItem {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string body = 4;
  string kind = 5;
  repeated string tags = 6;
  string summary = 7;
  string owner = 8;
  string status = 9;
  string extra_json = 10;
  string created_at = 11;
  string updated_at = 12;
  string scope_node_id = 13;
}

message KnowledgeEntityLink {
  string id = 1;
  string project_id = 2;
  string knowledge_id = 3;
  string entity_id = 4;
  string predicate = 5;
  string truth_class = 6;
  string source = 7;
  string actor = 8;
  string observed_at = 9;
  string created_at = 10;
}

message KnowledgeSearchHit {
  KnowledgeItem item = 1;
  double score = 2;
  string snippet = 3;
  string truth_class = 4;
  string source = 5;
}

message SaveKnowledgeRequest {
  KnowledgeItem item = 1;
  // Required for Desktop semantic writes (B9): summary + rationale.
  ChangeEnvelope change = 2;
}
message SaveKnowledgeResponse { KnowledgeItem item = 1; }
message ListKnowledgeRequest {
  string project_id = 1;
  string kind = 2;
  string scope_node = 3;
  bool scope_exact = 4;
}
message ListKnowledgeResponse { repeated KnowledgeItem items = 1; }
message DeleteKnowledgeRequest {
  string id = 1;
  ChangeEnvelope change = 2;
}
message DeleteKnowledgeResponse {}

message SearchKnowledgeRequest {
  string project_id = 1;
  string query = 2;
  string kind = 3;
  int32 limit = 4;
}
message SearchKnowledgeResponse {
  repeated KnowledgeSearchHit hits = 1;
}

message ListKnowledgeLinksRequest {
  string project_id = 1;
  string knowledge_id = 2;
  string entity_id = 3;
}
message ListKnowledgeLinksResponse {
  repeated KnowledgeEntityLink links = 1;
}

message SaveKnowledgeLinkRequest {
  KnowledgeEntityLink link = 1;
  ChangeEnvelope change = 2;
}
message SaveKnowledgeLinkResponse {
  KnowledgeEntityLink link = 1;
}

message DeleteKnowledgeLinkRequest {
  string id = 1;
  ChangeEnvelope change = 2;
}
message DeleteKnowledgeLinkResponse {}

service KnowledgeService {
  rpc SaveKnowledge(SaveKnowledgeRequest) returns (SaveKnowledgeResponse);
  rpc ListKnowledge(ListKnowledgeRequest) returns (ListKnowledgeResponse);
  rpc DeleteKnowledge(DeleteKnowledgeRequest) returns (DeleteKnowledgeResponse);
  rpc SearchKnowledge(SearchKnowledgeRequest) returns (SearchKnowledgeResponse);
  rpc ListKnowledgeLinks(ListKnowledgeLinksRequest) returns (ListKnowledgeLinksResponse);
  rpc SaveKnowledgeLink(SaveKnowledgeLinkRequest) returns (SaveKnowledgeLinkResponse);
  rpc DeleteKnowledgeLink(DeleteKnowledgeLinkRequest) returns (DeleteKnowledgeLinkResponse);
}
